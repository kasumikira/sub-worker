name: Deploy Cloudflare Worker (dev)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/deploy-cloudflare-dev.yml"
      - "backend/**"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Worker
        working-directory: backend
        run: pnpm bundle:cloudflare

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --env dev
