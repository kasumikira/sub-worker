name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/sub-store-org/Sub-Store.git
          git fetch --no-tags upstream master
          git reset --hard upstream/master

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: dev
          branch: sync/upstream-master
          delete-branch: true
          title: "chore: sync upstream"
          body: "Automatically generated from sub-store-org/Sub-Store:master."
